spring:
  application:
    name: hnn
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
  datasource:
    driverClassName: org.mariadb.jdbc.Driver
    # Render의 환경 변수에서 실제 DB 접속 정보를 가져옵니다.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      connection-timeout: 30000
      max-lifetime: 900000
      validation-timeout: 3000

jwt:
  # JWT_EXPIRATION_TIME 미설정 시 기본 1시간 (밀리초). application.properties와 값 통일.
  # 실제 만료는 JwtAuthenticationFilter가 매 요청마다 토큰을 재발급(슬라이딩)하므로,
  # 이 값은 "마지막 활동으로부터의" 만료 시간을 의미함.
  secret: ${JWT_SECRET_KEY}
  expiration: ${JWT_EXPIRATION_TIME:3600000}